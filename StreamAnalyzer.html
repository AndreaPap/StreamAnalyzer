<!DOCTYPE html>

<html lang="it">

    <head>
        <meta charset="UTF-8">
        <title>Stream analyzer</title>

        <style>
            html, body 
            {
                margin: 0;
                height: 100%;
            }

            .MasterLayout
            {
                display: grid;
                grid-template-columns: 50% 50%;
                grid-template-rows: 10% 35% 10% 10% 35%;
                box-sizing: border-box;
                height: 100%;
                width: 100%;
            }
            
            .HalfSplit
            {
            	display: grid;
                grid-template-columns: 50% 50%;
                grid-template-rows: 100%;
                box-sizing: border-box;
                height: 100%;
                width: 100%;
            }
            
            .NormalText 
            {
                display: flex;
                align-items: center;
                justify-content: center;
                border: 1px solid #333;
                box-sizing: border-box;
                font-family: monospace;
                font-size: 2em;
                width: 100%;
                height: 100%;                    
            }

            .BigText
            {
                display: flex;
                align-items: center;
                justify-content: center;
                border: 1px solid #333;
                box-sizing: border-box;
                font-family: monospace;
                font-size: 2.5em;
                width: 100%;
                height: 100%;                    
            }

            .Button
            {
                border: 1px solid #333;
                font-family: monospace;
                font-size: 2.5em;
                box-sizing: border-box;
                width: 100%;
                height: 100%;                    
            }
			
		</style>
		
	</head>
	
	<body>
	
		<div class = "MasterLayout">
		
				<div class="BigText">Prior stream</div>
				<div class="BigText">New stream</div>
			
				<textarea class = "NormalText" id = "InputPriori"></textarea>
				<textarea class = "NormalText" id = "InputNew"></textarea>
			
			
				<button class = "Button" onclick="EvaluateCallback()">Evaluate</button>
				<button class = "Button" onclick="ResetCallback()">Reset</button>
				
				<div class="BigText">New stream information</div>
				<div class="BigText">Event information</div>
			
				<textarea class = "NormalText" id = "OutputInfoStream"></textarea>
				<textarea class = "NormalText" id = "OutputInfoEvent"></textarea>
			
		</div>
		
		<script>
			
			let State =
			{
				"PPriori" 	: 		{},
				"EventsNew"		:	[],
			}
			
			function StateFunctionReset()
			{
				State[ "PPriori" ] = {};
				State[ "EventsNew" ] = [];
			}
			
			function StateFunctionLoad( PrioriStream, NewStream )
			{
				State[ "PPriori" ] = {};
				State[ "EventsNew" ] = [];
				
				let Events = PrioriStream.split(/\s+/);
				Events.forEach( Event => 
				{ 
					if( Event.length > 0 && Event != " " && Event != "\n" )
					{
						State[ "PPriori" ][ Event ] = ( State[ "PPriori" ][ Event ] || 0 ) + 1;
					} 
				} );
				
				Events = NewStream.split(/\s+/);
				Events.forEach( Event => 
				{ 
					if( Event.length > 0 && Event != " " && Event != "\n" )
					{
						State[ "EventsNew" ].push( Event );
					} 
				} );
				
				let Norm = 0;
				for( let Event in State[ "PPriori" ] ){ Norm += State[ "PPriori" ][ Event ]; } 
				for( let Event in State[ "PPriori" ] ){ State[ "PPriori" ][ Event ] /= Norm; } 
			}
			
			function OutputFunctionReset()
			{
				document.getElementById( "InputPriori" ).value = "";
				document.getElementById( "InputNew" ).value = "";
				document.getElementById( "OutputInfoStream" ).value = "";
				document.getElementById( "OutputInfoEvent" ).value = "";
			}
			
			function OutputFunctionRender()
			{
				document.getElementById( "InputNew" ).value = "";
				
				if( State[ "EventsNew" ].length != 0 )
				{
					let PPost = 1;
					
					for ( let Event of State[ "EventsNew" ] ){ PPost *= State[ "PPriori" ][ Event ]; }
					
					let IPost = - Math.log2( PPost );
					
					document.getElementById( "OutputInfoStream" ).value += 
						FixConcat( FixConcat( State[ "EventsNew" ].join( " " ) + ":", IPost.toFixed( 3 ), 10 ), "[ bit ]\n", 20 );
				}
					
				document.getElementById( "OutputInfoEvent" ).value = "";
				for ( let Event in State[ "PPriori" ] )
				{
					document.getElementById( "OutputInfoEvent" ).value += 
						FixConcat( FixConcat( Event + ":", - Math.log2( State[ "PPriori" ][ Event ] ).toFixed( 3 ), 10 ), "[ bit ]\n", 20 );	
				}
				
			}
			
			function FixConcat( Str1, Str2, Spaces )
			{
				return Str1 + " ".repeat( Spaces - Str1.length ) + Str2;
			}
			
			function ResetCallback()
			{
				StateFunctionReset();
				OutputFunctionReset();
			}
			
			function EvaluateCallback()
			{
				StateFunctionLoad(  document.getElementById( "InputPriori" ).value,
									document.getElementById( "InputNew" ).value );
				OutputFunctionRender();
			}
			ds
			document.getElementById( "InputNew" ).addEventListener('keydown', function( event ) { if (event.key === 'Enter') { event.preventDefault(); EvaluateCallback(); } } );
			
		</script>
		
    </body>
    

    
</html>
