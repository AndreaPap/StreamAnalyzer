<!DOCTYPE html>

<html lang="it">

    <head>
        <meta charset="UTF-8">
        <title>Stream analyzer</title>

        <style>
            html, body 
            {
                margin: 0;
                height: 100%;
            }

            .MasterLayout
            {
                display: grid;
                grid-template-columns: 100%;
                grid-template-rows: 5% 30% 5% 60%;
                box-sizing: border-box;
                height: 100%;
                width: 100%;
            }
            
            .HalfSplit
            {
            	display: grid;
                grid-template-columns: 50% 50%;
                grid-template-rows: 100%;
                box-sizing: border-box;
                height: 100%;
                width: 100%;
            }
            
            .NormalText 
            {
                display: flex;
                align-items: center;
                justify-content: center;
                border: 1px solid #333;
                box-sizing: border-box;
                font-family: Arial, sans-serif;
                font-size: 1.2em;
                width: 100%;
                height: 100%;                    
            }

            .BigText
            {
                display: flex;
                align-items: center;
                justify-content: center;
                border: 1px solid #333;
                box-sizing: border-box;
                font-family: Arial, sans-serif;
                font-size: 1.7em;
                width: 100%;
                height: 100%;                    
            }

            .Button
            {
                border: 1px solid #333;
                font-family: Arial, sans-serif;
                font-size: 1.2em;
                box-sizing: border-box;
                width: 100%;
                height: 100%;                    
            }
			
		</style>
		
	</head>
	
	<body>
	
		<div class = "MasterLayout">
		
			<div class = "HalfSplit">
				<div class="BigText">PRIORI STREAM</div>
				<div class="BigText">NEW STREAM</div>
			</div>
			
			<div class = "HalfSplit">
				<textarea class = "NormalText" id = "InputPriori"></textarea>
				<textarea class = "NormalText" id = "InputNew"></textarea>
			</div>
			
			<div>
				<button class = "Button" onclick="ButtonCallback()">EVALUATE</button>
			</div>
			
			<div>
				<textarea class = "NormalText" id = "OutputArea"></textarea>
			</div>
			
		</div>
		
		<script>
			
			let State =
			{
				"PPriori" 	: 	{},
				"EventsNew"		:	[],
			}
			
			function StateFunctionLoad( PrioriStream, NewStream )
			{
				State[ "PPriori" ] = {};
				State[ "EventsNew" ] = [];
				
				let Events = PrioriStream.split(/\s+/);
				Events.forEach( Event => 
				{ 
					if( Event.length > 0 && Event != " " && Event != "\n" )
					{
						State[ "PPriori" ][ Event ] = ( State[ "PPriori" ][ Event ] || 0 ) + 1;
					} 
				} );
				
				Events = NewStream.split(/\s+/);
				Events.forEach( Event => 
				{ 
					if( Event.length > 0 && Event != " " && Event != "\n" )
					{
						State[ "EventsNew" ].push( Event );
					} 
				} );
				
				let Norm = 0;
				for( Event in State[ "PPriori" ] ){ Norm += State[ "PPriori" ][ Event ]; } 
				for( Event in State[ "PPriori" ] ){ State[ "PPriori" ][ Event ] /= Norm; } 
			}
			
			function OutputFunctionRender()
			{
				let PPost = 1;
				for ( let Event of State[ "EventsNew" ] ){ PPost *= State[ "PPriori" ][ Event ]; }
				
				let IPost = - Math.log2( PPost );
				
				document.getElementById( "OutputArea" ).value += 
					State[ "EventsNew" ].join( " " ) + ": " + IPost.toFixed( 3 ) + " [ bit ]\n";
				
			}
			
			function ButtonCallback()
			{
				StateFunctionLoad(  document.getElementById( "InputPriori" ).value,
									document.getElementById( "InputNew" ).value );
				OutputFunctionRender();
			}
			
		</script>
		
    </body>
    

    
</html>
